name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade "redis>=5.0.0"
          pip install pytest

      - name: Create dummy prompts module for CI
        run: |
          mkdir -p app/prompts
          touch app/prompts/__init__.py

      - name: run tests
        env:
          PYTHONPATH: .
        run: |
          pytest