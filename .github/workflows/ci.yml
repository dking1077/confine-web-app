name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --force-reinstall "redis>=5.0.0"

      # prompts.py is gitignored (private), so tests run against a stub
      - name: stub private prompts module
        run: |
          printf 'def __getattr__(name):\n    return lambda *args, **kwargs: []\n' > app/prompts.py

      - name: run tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build image
        run: docker build -t confine-web-app:ci .