apiVersion: apps/v1
kind: Deployment
metadata:
  name: confine-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: confine-worker
  template:
    metadata:
      labels:
        app: confine-worker
    spec:
      enableServiceLinks: false
      containers:
        - name: worker
          image: confine-web:local
          imagePullPolicy: Never
          command: ["celery"]
          args: ["-A", "app.celery.worker:celery", "worker", "-l", "info", "--concurrency=2"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: confine-config
            - secretRef:
                name: confine-secrets